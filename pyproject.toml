[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mlserve"
version = "0.1.0"
description = "Forest cover-type model taken from a row-by-row notebook prototype to production: vectorised and validated features, ONNX export with parity checks, FastAPI with micro-batching, and measured speed-ups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "skl2onnx>=1.17", "onnx>=1.15", "onnxruntime>=1.17", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.5", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mlserve = "mlserve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlserve"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
